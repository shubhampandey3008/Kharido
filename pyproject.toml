[project]
name = "kharido"
version = "0.1.0"
description = "Agentic AI shopping assistant — one decisive recommendation from free-form queries"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Orchestration
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "litellm>=1.50.0",

    # Structured output + settings
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",

    # Web search (criteria research)
    "tavily-python>=0.5.0",

    # Product scraping
    "httpx>=0.27.0",
    "trafilatura>=1.12.0",

    # Caching
    "diskcache>=5.6.0",

    # Preference memory
    "mem0ai>=0.1.0",

    # Tracing
    "langsmith>=0.1.140",

    # API backend
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "tenacity>=9.0.0",
    "structlog>=24.0.0",
]

[project.scripts]
kharido = "kharido.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "ipython>=8.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
